/* ================= FIREWORKS (multi-pattern) ================= */
const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
let W,H, rockets=[], sparks=[];
const PALETTE = ['#ffd54a','#ffecb3','#ff9d2e','#ff6f43','#fff3c4','#ffca28','#ff8fa3','#b388ff','#8be9fd'];
function resize(){ W = fx.width = innerWidth; H = fx.height = innerHeight; }
addEventListener('resize', resize); resize();
const rnd = (a,b)=>a+Math.random()*(b-a);

function launchRocket(x, targetY){
  rockets.push({x: x ?? rnd(W*0.12,W*0.88), y: H+12, vx:rnd(-1.4,1.4),
    vy:-rnd(H*0.0105,H*0.0145), targetY: targetY ?? rnd(H*0.10,H*0.42),
    color: PALETTE[Math.random()*PALETTE.length|0]});
}
function explode(x,y,color,big,pattern){
  pattern = pattern ?? (big ? ['sphere','ring','willow','heart'][Math.random()*4|0] : (Math.random()<0.75?'sphere':'ring'));
  if(pattern==='ring'){
    const n = big?110:80, base = rnd(0,Math.PI*2);
    for(let i=0;i<n;i++){ const a=base+i/n*Math.PI*2, sp=rnd(4.6,5.4);
      sparks.push(mkSpark(x,y,Math.cos(a)*sp,Math.sin(a)*sp,color,0.012)); }
  } else if(pattern==='willow'){
    for(let i=0;i<130;i++){ const a=rnd(0,Math.PI*2), sp=Math.pow(Math.random(),0.5)*4.2;
      const s = mkSpark(x,y,Math.cos(a)*sp,Math.sin(a)*sp,'#ffd54a',0.0055);
      s.r = rnd(1.4,2.6); sparks.push(s); }
  } else if(pattern==='heart'){
    for(let i=0;i<110;i++){ const t=rnd(0,Math.PI*2);
      const hx = 16*Math.pow(Math.sin(t),3), hy = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      const k = 0.16;
      sparks.push(mkSpark(x,y,hx*k*rnd(.85,1.1),hy*k*rnd(.85,1.1),Math.random()<.6?'#ff8fa3':color,0.014)); }
  } else {
    const n = big?120:85;
    for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), sp=Math.pow(Math.random(),0.62)*rnd(4,7);
      sparks.push(mkSpark(x,y,Math.cos(a)*sp,Math.sin(a)*sp,Math.random()<0.72?color:PALETTE[Math.random()*PALETTE.length|0],rnd(0.008,0.02))); }
  }
}
function mkSpark(x,y,vx,vy,color,decay){
  return {x,y,vx,vy,life:1,decay,color,r:rnd(1,2.4),tw:Math.random()*Math.PI*2,crackle:Math.random()<0.1};
}
let fireworksOn=false, lastAuto=0;
function fxLoop(t){
  fctx.globalCompositeOperation='destination-out';
  fctx.fillStyle='rgba(0,0,0,0.22)'; fctx.fillRect(0,0,W,H);
  fctx.globalCompositeOperation='lighter';
  if(fireworksOn && t-lastAuto > rnd(520,820)){ launchRocket(); lastAuto=t; }
  rockets = rockets.filter(r=>{
    r.x+=r.vx; r.y+=r.vy; r.vy+=0.05;
    fctx.beginPath(); fctx.arc(r.x,r.y,2.6,0,7); fctx.fillStyle=r.color;
    fctx.shadowColor=r.color; fctx.shadowBlur=10; fctx.fill(); fctx.shadowBlur=0;
    if(r.y<=r.targetY || r.vy>-1){ explode(r.x,r.y,r.color,Math.random()<0.3); return false; }
    return true;
  });
  sparks = sparks.filter(s=>{
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.028; s.vx*=0.985; s.vy*=0.985; s.life-=s.decay;
    if(s.life<=0){
      if(s.crackle){ for(let i=0;i<5;i++){ const a=rnd(0,Math.PI*2);
        sparks.push(mkSpark(s.x,s.y,Math.cos(a)*1.6,Math.sin(a)*1.6,'#fff3c4',0.05)); } }
      return false;
    }
    const tw = 0.7+0.3*Math.sin(t/90+s.tw);
    fctx.globalAlpha = Math.max(s.life,0)*tw;
    fctx.beginPath(); fctx.arc(s.x,s.y,Math.max(s.r*s.life,0.3),0,7);
    fctx.fillStyle=s.color; fctx.fill(); fctx.globalAlpha=1;
    return true;
  });
  requestAnimationFrame(fxLoop);
}
requestAnimationFrame(fxLoop);
/* small golden burst helper (envelope / buttons) */
function burstAt(el, n=46){
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), sp=rnd(1.5,5.5);
    sparks.push(mkSpark(cx,cy,Math.cos(a)*sp,Math.sin(a)*sp,
      Math.random()<0.7?'#ffd54a':'#fff3c4',rnd(0.015,0.03))); }
}

/* ================= GOLDEN MOTES ================= */
const mc = document.getElementById('motes'), mctx = mc.getContext('2d');
function mResize(){ mc.width=innerWidth; mc.height=innerHeight; }
addEventListener('resize', mResize); mResize();
const motes = Array.from({length:80},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  r:rnd(0.6,2.4),a:rnd(0.12,0.5),vx:rnd(-0.16,0.16),vy:rnd(-0.45,-0.12),ph:rnd(0,Math.PI*2)}));
(function mLoop(t){
  mctx.clearRect(0,0,mc.width,mc.height);
  for(const m of motes){
    m.x+=m.vx+Math.sin(t/1500+m.ph)*0.18; m.y+=m.vy;
    if(m.y<-12){m.y=mc.height+12;m.x=Math.random()*mc.width;}
    if(m.x<-12)m.x=mc.width+12; if(m.x>mc.width+12)m.x=-12;
    const tw = 0.5+0.5*Math.sin(t/280+m.ph*3);
    mctx.beginPath(); mctx.arc(m.x,m.y,m.r,0,7);
    mctx.fillStyle=`rgba(255,205,90,${m.a*tw})`; mctx.fill();
  }
  requestAnimationFrame(mLoop);
})(0);

/* ================= MOUSE-FOLLOWING SPARKLES ================= */
const cc = document.getElementById('cursorFx'), cctx = cc.getContext('2d');
const fine = matchMedia('(pointer:fine)').matches;
if(fine){
  function cResize(){ cc.width=innerWidth; cc.height=innerHeight; }
  addEventListener('resize', cResize); cResize();
  let trail = [];
  addEventListener('mousemove', e=>{
    for(let i=0;i<2;i++) trail.push({x:e.clientX+rnd(-6,6),y:e.clientY+rnd(-6,6),
      vx:rnd(-0.7,0.7),vy:rnd(-1.4,-0.2),life:1,r:rnd(0.8,2.2)});
    if(trail.length>120) trail.splice(0, trail.length-120);
  });
  (function cLoop(){
    cctx.clearRect(0,0,cc.width,cc.height);
    trail = trail.filter(p=>{
      p.x+=p.vx; p.y+=p.vy; p.life-=0.03;
      if(p.life<=0) return false;
      cctx.beginPath(); cctx.arc(p.x,p.y,p.r*p.life,0,7);
      cctx.fillStyle=`rgba(255,215,100,${0.65*p.life})`; cctx.fill();
      return true;
    });
    requestAnimationFrame(cLoop);
  })();
} else { cc.style.display='none'; }

/* ================= PARALLAX ================= */
if(fine){
  const layers = document.querySelectorAll('[data-depth]');
  let tx=0, ty=0, px=0, py=0;
  addEventListener('mousemove', e=>{ tx=(e.clientX/innerWidth-0.5); ty=(e.clientY/innerHeight-0.5); });
  (function parLoop(){
    px += (tx-px)*0.045; py += (ty-py)*0.045;
    layers.forEach(l=>{ const d=+l.dataset.depth;
      l.style.transform=`translate(${-px*d}px, ${-py*d}px)`; });
    requestAnimationFrame(parLoop);
  })();
}

/* ================= LANTERNS ================= */
for(let i=0;i<8;i++){
  const l=document.createElement('div'); l.className='lantern';
  l.style.left=(3+Math.random()*90)+'vw';
  l.style.setProperty('--dur',rnd(17,30)+'s');
  l.style.setProperty('--delay',(-Math.random()*26)+'s');
  l.style.setProperty('--sway',((Math.random()*170-85)|0)+'px');
  l.innerHTML='<div class="lb"></div>';
  l.firstChild.style.transform=`scale(${rnd(0.65,1.35)})`;
  document.body.appendChild(l);
}

/* ================= SCROLL REVEALS ================= */
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}),{threshold:0.12});
document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el));

/* ================= AMBIENT MUSIC (WebAudio) ================= */
let actx=null, musicOn=false, musicTimer=null, masterGain=null;
const SCALE=[261.63,293.66,329.63,392.0,440.0,523.25,587.33];
function initAudio(){
  actx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = actx.createGain(); masterGain.gain.value=0.16;
  const delay = actx.createDelay(1.2); delay.delayTime.value=0.42;
  const fb = actx.createGain(); fb.gain.value=0.34;
  const wet = actx.createGain(); wet.gain.value=0.4;
  masterGain.connect(actx.destination);
  masterGain.connect(delay); delay.connect(fb); fb.connect(delay);
  delay.connect(wet); wet.connect(actx.destination);
}
function pluck(){
  if(!musicOn) return;
  const o=actx.createOscillator(), g=actx.createGain();
  const f = SCALE[Math.random()*SCALE.length|0] * (Math.random()<0.25?2:1);
  o.type = Math.random()<0.4?'sine':'triangle'; o.frequency.value=f;
  const t=actx.currentTime;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.5+Math.random()*0.3, t+0.03);
  g.gain.exponentialRampToValueAtTime(0.001, t+1.9);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+2);
}
const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click',()=>{
  if(!actx) initAudio();
  if(actx.state==='suspended') actx.resume();
  musicOn=!musicOn;
  musicBtn.classList.toggle('playing',musicOn);
  musicBtn.textContent = musicOn?'🎶':'🎵';
  if(musicOn){ pluck(); musicTimer=setInterval(pluck,900); }
  else clearInterval(musicTimer);
});

/* ================= SCENE FLOW ================= */
const cta=document.getElementById('ctaBtn'), exp=document.getElementById('experience');
cta.addEventListener('click',()=>{
  fireworksOn=true;
  for(let i=0;i<7;i++) setTimeout(()=>launchRocket(), i*150);
  const land=document.getElementById('landing');
  land.style.transition='opacity .9s ease, transform .9s ease';
  land.style.opacity='0'; land.style.transform='scale(.96) translateY(-24px)';
  setTimeout(()=>{ land.style.display='none'; exp.classList.add('show');
    exp.querySelectorAll('.reveal').forEach((el,i)=>setTimeout(()=>el.classList.add('in'), i*160));
    exp.scrollIntoView({behavior:'smooth'});
  }, 700);
});

/* ================= ENVELOPE ================= */
const env=document.getElementById('envelope'), hint=document.getElementById('envHint');
function toggleEnv(){
  const opening = !env.classList.contains('open');
  env.classList.toggle('open');
  if(opening){
    burstAt(env, 52);
    hint.textContent='✦ Tap again to close ✦';
    launchRocket(); setTimeout(()=>launchRocket(),320);
  } else {
    hint.textContent='✦ Tap the envelope ✦';
  }
}
env.addEventListener('click',toggleEnv);
env.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleEnv();} });

/* ================= PERSONALIZATION & WHATSAPP ================= */
const nameInput=document.getElementById('nameInput'), makeBtn=document.getElementById('makeBtn'),
      waBtn=document.getElementById('waBtn'), out=document.getElementById('greetingOut'),
      bigGreet=document.getElementById('bigGreet'),
      letterTitle=document.getElementById('letterTitle'), letterMsg=document.getElementById('letterMsg');
const DEFAULT_MSG = "Wishing you and your family a very Happy Diwali! May your life always shine with happiness, success, prosperity and endless possibilities. ❤️";
let lastGreeting = "";
function buildGreeting(name){
  const who = name ? `Dear ${name},` : "Dear you,";
  return `${who}\n\n${DEFAULT_MSG}\n\n— Diwali Wishes from Anuj ❤️`;
}
makeBtn.addEventListener('click',()=>{
  const name=nameInput.value.trim();
  lastGreeting=buildGreeting(name);
  if(name){
    bigGreet.textContent=`Happy Diwali, ${name}!`;
    letterTitle.textContent=`A letter for ${name} 💌`;
    letterMsg.textContent=`${name}, ${DEFAULT_MSG}`;
  }
  out.innerHTML=`<div class="g-title">${name?`For ${name}`:'For you'} 🪔</div>`+
    `<div class="g-body">${lastGreeting.replace(/\n/g,'<br>')}</div>`;
  out.style.display='block';
  waBtn.disabled=false;
  fireworksOn=true; launchRocket(); setTimeout(()=>launchRocket(),250);
  burstAt(makeBtn, 30);
  out.scrollIntoView({behavior:'smooth',block:'center'});
});
waBtn.addEventListener('click',()=>{
  const text = encodeURIComponent(lastGreeting || buildGreeting(nameInput.value.trim()));
  window.open(`https://wa.me/?text=${text}`,'_blank');
});
</script>
